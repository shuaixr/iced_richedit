[package]
name = "iced_richedit"
version = "0.1.0"
edition = "2024"
description = "A rich text editor widget for iced"
license = "MIT OR Apache-2.0"
keywords = ["iced", "rich-text", "editor", "widget", "gui"]
categories = ["gui", "text-editors"]

[dependencies]
iced = { git = "https://github.com/iced-rs/iced.git", rev = "cd04b74ca7073766f654535d6e72c452ef749d07", default-features = false, features = ["advanced", "thread-pool"] }
prosemirror = "=0.5.2"
serde_json = "1"
unicode-segmentation = "1.13.3"

[features]
renderer-tests = ["iced/tiny-skia"]
example-basic = ["iced/tiny-skia", "iced/fira-sans"]
perf-diagnostics = []

[[example]]
name = "basic"
required-features = ["example-basic"]
